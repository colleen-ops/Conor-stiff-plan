name: nightly-spiff-master

# 11:00 PM America/New_York year-round.
# GitHub cron is UTC only and never shifts for DST, so both candidate hours
# fire and the guard step kills the wrong one.
#   EDT (Mar-Nov, UTC-4): 23:00 ET = 03:00 UTC next day
#   EST (Nov-Mar, UTC-5): 23:00 ET = 04:00 UTC next day
on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:        # manual "Run workflow" button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Bail unless it is 11 PM in New York
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          echo "New York hour: $HOUR"
          if [ "$HOUR" != "23" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "Wrong DST branch, skipping."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install requests google-auth google-api-python-client

      - name: Check secrets are present
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          QB_TOKEN: ${{ secrets.QB_TOKEN }}
        run: |
          echo "GOOGLE_SERVICE_ACCOUNT_JSON length: ${#GOOGLE_SERVICE_ACCOUNT_JSON}"
          echo "first char: ${GOOGLE_SERVICE_ACCOUNT_JSON:0:1}"
          echo "QB_TOKEN length: ${#QB_TOKEN}"
